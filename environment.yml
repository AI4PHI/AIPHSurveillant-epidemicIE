# Conda environment of the EIOS epidemic information-extraction pipeline
# (llm_extraction_AutomatedDynamicPipeline.py, ONTO-RESOURCES_eKG.py and
#  SCHEDULE-RUN_AutomatedDynamicPipeline.py).
#
# Full export of a working environment, frozen on Linux aarch64 with a CUDA 13.0 GPU. Recreate it
# with:
#     conda env create -f environment.yml
#     conda activate epidemic-ie
#
# The conda part is Python 3.12.3 + system libraries only; everything else (torch, transformers,
# peft, bitsandbytes, pandas, rdflib, ...) comes from the pip section at the end of this file.
# torch is the CUDA 13.0 build ("+cu130"), which is not on PyPI: on a machine where conda cannot
# resolve it, install the pip part with
#     pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cu130
# and on a different platform pick the torch build matching the local CUDA (or the CPU one).
#
# Exported again on 2026-10-12, after the upgrade of the pip part for the extraction model
# jattokatarratto/EpiQwen3.5-9B (transformers 5.17.0, torch 2.14.0+cu130, peft 0.21.0,
# accelerate 1.15.0): its base model Qwen/Qwen3.5-9B needs transformers >= 5.17.0 for the class
# Qwen3_5ForConditionalGeneration. See the note at the top of requirements.txt. The conda part
# (Python 3.12.3 and the system libraries) was not touched by that upgrade.
